services:
  api:
    build: .
    volumes:
      - .:/code
    environment:
      JUDGE0_URL: http://server:2358
      LANGUAGE_ID: "54"
    ports:
      - "8000:8000"
    depends_on:
      - server
      - redis
      - db

  server:
    image: judge0/judge0:latest
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    env_file:
      - ./judge0/judge0.conf
    ports:
      - "2358:2358"
    privileged: true
    restart: always

  worker:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    env_file:
      - ./judge0/judge0.conf
    privileged: true
    restart: always

  db:
    image: postgres:16.2
    env_file:
      - ./judge0/judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    restart: always

  redis:
    image: redis:7.2.4
    command:
      [
        "bash",
        "-c",
        "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""
      ]
    env_file:
      - ./judge0/judge0.conf
    restart: always

volumes:
  data:
